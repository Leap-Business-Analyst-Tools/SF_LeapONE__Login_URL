<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LeapONE</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #6b3fa0, #3b1c5a);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .card {
      text-align: center;
      max-width: 420px;
      padding: 40px;
      background: rgba(255,255,255,0.08);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    h1 {
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    p {
      opacity: 0.9;
      line-height: 1.5;
    }

    .tag {
      margin-top: 16px;
      font-size: 12px;
      opacity: 0.7;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>LeapONE</h1>
    <p>
      The unified policy, billing, and claims platform for Leap.
    </p>
    <div class="tag">Production Environment</div>
  </div>
</body>
</html>
